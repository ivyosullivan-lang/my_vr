<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ivy VR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
    <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
</head>
<!-- This is the main body of the website- ALL your content goes AFTER the <body> tag and before the </body> tag -->
<body>
<!--envivoronment-->
<a-scene>
    <a-assets>
<!--assets-->
<img id="wall" src="images/myflower.jpg" title="">
<img id="art1" src="images/aussie.png" preload="auto">
<!--a-assets-->
</a-assets>

<a-entity environment="preset:dream;dressingAmount:500;skyColor:#A2E8DD"></a-entity>
<!-- Museum floor starts here -->
<a-cylinder id="floor" position="0 0 0" radius="7.5" color="pink" height="0.1"></a-cylinder>
<a-box id="wall1" position="0 1.473 4.907" rotation="0 0 0" scale="10 3 0.2" color="#E8DCB9"></a-box>
<a-box id="wall2" position="0 1.473 -4.907" rotation="0 0 0" scale="10 3 0.2" color="#E8DCB9"></a-box>
<a-box id="wall3" position="5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#E8DCB9"></a-box>
<a-box id="wall4" position="-5.049 1.454 -0.008" rotation="0 -90 0" scale="10 3 0.2" color="#E8DCB9"></a-box>
<!--roof-->
<a-cylinder id="triangle_front" segments-radial="3" position="0 3.874 4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="#F2CEE6"></a-cylinder>
<a-cylinder id="triangle_back" segments-radial="3" position="0 3.874 -4.907" rotation="-90 0 0" scale="5.774 0.2 1.8" color="#F2CEE6"></a-cylinder>
<a-box id="roof_right" position="2.580 4.328 0" rotation="28.433 90 0" scale="10.931 0.20 6.110" color="#F2CEE6"></a-box>
<a-box id="roof_left" position="-2.599 4.321 -0.017" rotation="28.433 -90 0" scale="10.931 0.20 6.130" color="#F2CEE6"></a-box>
<!--ART-->
<a-plane id="art2" src="#art2" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>

<a-plane id="art1" src="#art1" scale="2 2 0.05" rotation="0 0 0" position="-0.162 1.934 -4.792"></a-plane>
</a-scene>
</body>
</html>
